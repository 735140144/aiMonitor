# 参考文件：实际 Secret 请用命令行创建，避免把令牌写进仓库
#
#   kubectl create secret generic ai-monitor-secrets -n etl \
#     --from-literal=access-token="$(openssl rand -hex 16)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
apiVersion: v1
kind: Secret
metadata:
  name: ai-monitor-secrets
  namespace: etl
type: Opaque
stringData:
  access-token: "replace-with-a-random-token"
