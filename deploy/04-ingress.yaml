apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-monitor
  namespace: etl
  labels:
    app.kubernetes.io/name: ai-monitor
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: lucky37
  rules:
    - host: balance.lucky37.cn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ai-monitor
                port:
                  name: http
