apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-monitor
  namespace: etl
  labels:
    app.kubernetes.io/name: ai-monitor
    app.kubernetes.io/component: web
spec:
  # 账户数据以单文件 JSON 持久化在 PVC 上，多副本会互相覆盖，因此固定单副本。
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-monitor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-monitor
        app.kubernetes.io/component: web
    spec:
      imagePullSecrets:
        - name: harbor-registry
      securityContext:
        fsGroup: 1000
      containers:
        - name: ai-monitor
          image: hub.luckydcms.com/library/ai-monitor:20261011-04
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: AIMONITOR_HOST
              value: "0.0.0.0"
            - name: AIMONITOR_PORT
              value: "8787"
            - name: AIMONITOR_DATA
              value: /app/data
            - name: AIMONITOR_CACHE_MS
              value: "10000"
            - name: AIMONITOR_TIMEOUT_MS
              value: "15000"
            # 域名经网关 301 到 HTTPS，显式声明 Secure，避免令牌 Cookie 走明文
            - name: AIMONITOR_SECURE_COOKIE
              value: "1"
            - name: AIMONITOR_NOTIFY_INTERVAL_MS
              value: "60000"
            - name: AIMONITOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ai-monitor-secrets
                  key: access-token
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ai-monitor-data
        - name: tmp
          emptyDir: {}
